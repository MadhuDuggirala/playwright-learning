name: Playwright and Cucumber Tests

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      BASE_URL: https://www.saucedemo.com

    steps:
      # 1. Download source code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # 3. Install dependencies from package-lock.json
      - name: Install dependencies
        run: npm ci

      # 4. Install Chromium/Firefox/WebKit and Linux dependencies
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 5. Run Playwright Test suite
      - name: Run Playwright tests
        run: npx playwright test

      # 6. Run Cucumber BDD scenarios
      - name: Run Cucumber tests
        run: |
          npx cucumber-js features \
            --require step-definitions/**/*.js \
            --require support/**/*.js \
            --format progress \
            --format html:cucumber-report.html

      # 7. Upload Playwright HTML report
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # 8. Upload Cucumber HTML report
      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          name: cucumber-report
          path: cucumber-report.html
          retention-days: 30
